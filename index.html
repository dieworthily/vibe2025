<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List - Edit Only</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        table {
            margin: 20px auto;
            width: 70%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
        }
        #editModal {
            display: none;
            position: fixed;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }
        #editModalContent {
            background: white;
            padding: 20px;
            margin: 15% auto;
            width: 300px;
            border-radius: 5px;
        }
        #editModal input {
            width: 100%;
            padding: 8px;
        }
    </style>
</head>
<body>

<h2>To-Do List</h2>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Text</th>
            <th>Edit</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<!-- Модальное окно -->
<div id="editModal">
    <div id="editModalContent">
        <h3>Edit Item</h3>
        <input type="text" id="editInput">
        <div style="margin-top: 10px;">
            <button onclick="saveEdit()">Save</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    let currentEditId = null;

    function openEditModal(id, text) {
        currentEditId = id;
        document.getElementById('editInput').value = text;
        document.getElementById('editModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
        currentEditId = null;
    }

    function saveEdit() {
        const newText = document.getElementById('editInput').value.trim();
        if (newText && currentEditId !== null) {
            fetch(`/edit/${currentEditId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: newText })
            }).then(() => location.reload());
        }
    }
</script>

</body>
</html>
